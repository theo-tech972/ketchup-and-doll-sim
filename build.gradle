plugins {
    id 'com.android.application' version '8.5.2' apply false
}


android {
    namespace 'com.example.ketchupdoll'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.ketchupdoll'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
